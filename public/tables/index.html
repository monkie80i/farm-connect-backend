<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="icon" type="image/png" href="/favicon-accent-2.png"> -->
    <title>Farm Connect - Tables</title>
    <link rel="stylesheet" href="/tables/tables.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">Farm Connect</div>
        <div class="page-title">Database Tables</div>
        <nav class="top-links"><a href="/">Home</a><a href="/query">Query</a></nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <section class="nav-section">
                <button type="button" class="nav-heading" data-section-toggle="main" aria-expanded="true">
                    <span>Main Tables</span><span class="nav-chevron" aria-hidden="true">▾</span>
                </button>
                <div class="search-wrap">
                    <input id="mainTableSearch" class="table-search" type="search" placeholder="Search main tables…" autocomplete="off">
                    <button id="clearMainSearch" class="clear-search" type="button" aria-label="Clear main table search" title="Clear">×</button>
                </div>
                <div id="mainTables" class="table-list"></div>
            </section>

            <section class="nav-section">
                <button type="button" class="nav-heading" data-section-toggle="lookup" aria-expanded="true">
                    <span>Generic Lookup Tables</span><span class="nav-chevron" aria-hidden="true">▾</span>
                </button>
                <div class="search-wrap">
                    <input id="lookupTableSearch" class="table-search" type="search" placeholder="Search lookup tables…" autocomplete="off">
                    <button id="clearLookupSearch" class="clear-search" type="button" aria-label="Clear lookup table search" title="Clear">×</button>
                </div>
                <div id="lookupTables" class="table-list"></div>
            </section>
        </aside>

        <main id="content" class="content">
            <div class="empty-state"><h2>Select a table</h2><p>Choose a table from the left to view its structure.</p></div>
        </main>
    </div>

    <script src="/tables/tables.js"></script>
</body>
</html>
